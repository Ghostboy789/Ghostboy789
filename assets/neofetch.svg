<svg xmlns="http://www.w3.org/2000/svg" width="900" height="338" viewBox="0 0 900 338" role="img" aria-label="Profile card: Medhansh Shekhawat, product management intern focused on credit risk analytics, author of LimitIQ.">
  <defs>
    <style>
      .mono { font-family: 'SFMono-Regular', 'Consolas', 'Liberation Mono', 'Menlo', monospace; font-size: 14px; }
      .k    { fill: #58a6ff; font-weight: 600; }
      .v    { fill: #c9d1d9; }
      .dim  { fill: #8b949e; }
      .grn  { fill: #39d353; }
    </style>
  </defs>

  <rect width="900" height="338" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Bars carry their FINAL height/y in markup so the card is legible even where
       SMIL is not executed; the animation only replays the growth. -->
  <g transform="translate(48,86)">
    <rect x="0"   y="120" width="26" height="34"  fill="#0e4429" rx="2"><animate attributeName="height" from="0" to="34"  dur="0.5s" begin="0.2s"  fill="freeze"/><animate attributeName="y" from="154" to="120" dur="0.5s" begin="0.2s"  fill="freeze"/></rect>
    <rect x="34"  y="96"  width="26" height="58"  fill="#006d32" rx="2"><animate attributeName="height" from="0" to="58"  dur="0.5s" begin="0.35s" fill="freeze"/><animate attributeName="y" from="154" to="96"  dur="0.5s" begin="0.35s" fill="freeze"/></rect>
    <rect x="68"  y="66"  width="26" height="88"  fill="#26a641" rx="2"><animate attributeName="height" from="0" to="88"  dur="0.5s" begin="0.5s"  fill="freeze"/><animate attributeName="y" from="154" to="66"  dur="0.5s" begin="0.5s"  fill="freeze"/></rect>
    <rect x="102" y="30"  width="26" height="124" fill="#39d353" rx="2"><animate attributeName="height" from="0" to="124" dur="0.5s" begin="0.65s" fill="freeze"/><animate attributeName="y" from="154" to="30"  dur="0.5s" begin="0.65s" fill="freeze"/></rect>
    <rect x="136" y="82"  width="26" height="72"  fill="#1f6feb" rx="2"><animate attributeName="height" from="0" to="72"  dur="0.5s" begin="0.8s"  fill="freeze"/><animate attributeName="y" from="154" to="82"  dur="0.5s" begin="0.8s"  fill="freeze"/></rect>
    <line x1="-6" y1="156" x2="174" y2="156" stroke="#30363d" stroke-width="2"/>
    <text x="84" y="182" class="mono dim" font-size="12" text-anchor="middle">risk → decision
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.0s" fill="freeze"/>
    </text>
  </g>

  <g transform="translate(276,0)">
    <text x="0" y="52" class="mono"><tspan class="grn">medhansh</tspan><tspan class="dim">@</tspan><tspan class="grn">github</tspan>
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.2s" fill="freeze"/></text>
    <line x1="0" y1="64" x2="560" y2="64" stroke="#30363d" stroke-width="1"/>

    <text x="0" y="98"  class="mono"><tspan class="k">Role</tspan><tspan class="v">      Product Management Intern @ GaragePlug</tspan>
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.5s" fill="freeze"/></text>
    <text x="0" y="120" class="mono"><tspan class="k">Focus</tspan><tspan class="v">     Credit risk analytics · model development</tspan>
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.65s" fill="freeze"/></text>
    <text x="0" y="142" class="mono"><tspan class="k">Project</tspan><tspan class="v">   LimitIQ — live, governed credit-line decisioning</tspan>
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.8s" fill="freeze"/></text>
    <text x="0" y="164" class="mono"><tspan class="k">Model</tspan><tspan class="v">     HistGradientBoosting · sigmoid-calibrated</tspan>
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.95s" fill="freeze"/></text>
    <text x="0" y="186" class="mono"><tspan class="k">Test</tspan><tspan class="v">      ROC-AUC 0.781 · PR-AUC 0.568 · Brier 0.133</tspan>
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.1s" fill="freeze"/></text>
    <text x="0" y="208" class="mono"><tspan class="k">Evidence</tspan><tspan class="v">  Model card · validation review · 12-item issue ledger</tspan>
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.25s" fill="freeze"/></text>
    <text x="0" y="230" class="mono"><tspan class="k">Scope</tspan><tspan class="v">     Educational — not a lending system</tspan>
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.4s" fill="freeze"/></text>
    <text x="0" y="252" class="mono"><tspan class="k">Stack</tspan><tspan class="v">     Python · scikit-learn · FastAPI · SciPy MILP · Docker</tspan>
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.55s" fill="freeze"/></text>
    <text x="0" y="274" class="mono"><tspan class="k">Repos</tspan><tspan class="v">     8 public</tspan><tspan class="dim">   ·   </tspan><tspan class="k">Since</tspan><tspan class="v">  October 2020</tspan>
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.7s" fill="freeze"/></text>

    <g transform="translate(0,296)">
      <rect x="0"   width="34" height="14" rx="2" fill="#161b22"><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.9s"  fill="freeze"/></rect>
      <rect x="38"  width="34" height="14" rx="2" fill="#0e4429"><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.98s" fill="freeze"/></rect>
      <rect x="76"  width="34" height="14" rx="2" fill="#006d32"><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.06s" fill="freeze"/></rect>
      <rect x="114" width="34" height="14" rx="2" fill="#26a641"><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.14s" fill="freeze"/></rect>
      <rect x="152" width="34" height="14" rx="2" fill="#39d353"><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.22s" fill="freeze"/></rect>
      <rect x="190" width="34" height="14" rx="2" fill="#1f6feb"><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.30s" fill="freeze"/></rect>
      <rect x="228" width="34" height="14" rx="2" fill="#58a6ff"><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.38s" fill="freeze"/></rect>
    </g>
  </g>
</svg>
