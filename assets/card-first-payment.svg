<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-label="First Payment. A randomised microfinance trial read as a lender pilot decision. Two months of grace raised profit and default; the pilot failed its preset default cap.">
  <defs><style>
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .pulse { animation: pulse 1.8s ease-out infinite; transform-origin: 838px 34px }
    @keyframes pulse { from { opacity: .7; transform: scale(1) } to { opacity: 0; transform: scale(2.6) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style></defs>
  <rect width="900" height="190" rx="12" fill="#0d1117" stroke="#30363d"/>
  <rect width="6" height="190" rx="3" fill="#58a6ff"/>
  <circle cx="838" cy="34" r="5" fill="#3fb950" class="pulse"/><circle cx="838" cy="34" r="5" fill="#3fb950"/>
  <text x="852" y="39" class="mono" font-size="12" fill="#3fb950">LIVE</text>
  <text x="32" y="44" class="sans" font-size="26" font-weight="700" fill="#e6edf3">First Payment</text>
  <text x="32" y="70" class="sans" font-size="15" fill="#58a6ff">Two months of grace for 845 Kolkata borrowers, read as a credit pilot</text>
  <text x="32" y="100" class="sans" font-size="14" fill="#8b949e">Replication of a randomised trial, a pilot rule fixed in advance, expected-loss pricing and robustness checks.</text>
  <text x="32" y="120" class="sans" font-size="14" fill="#8b949e">Verdict: profit rose but default rose 6.14 pp (1.20 to 11.09) against a 2-point cap. Pilot fails.</text>
  <g transform="translate(32 136)"><g>
    <rect width="260" height="40" rx="8" fill="#161b22" stroke="#30363d"/><text x="14" y="26" class="mono" font-size="17" font-weight="700" fill="#e6edf3">+6.14 pp</text><text x="246" y="25" class="sans" font-size="12" fill="#8b949e" text-anchor="end">extra default</text>
  </g></g>
  <g transform="translate(308 136)"><g>
    <rect width="260" height="40" rx="8" fill="#161b22" stroke="#30363d"/><text x="14" y="26" class="mono" font-size="17" font-weight="700" fill="#e6edf3">+₹906.6</text><text x="246" y="25" class="sans" font-size="12" fill="#8b949e" text-anchor="end">weekly profit</text>
  </g></g>
  <g transform="translate(584 136)"><g>
    <rect width="284" height="40" rx="8" fill="#161b22" stroke="#30363d"/><text x="14" y="26" class="mono" font-size="17" font-weight="700" fill="#e6edf3">₹245.6</text><text x="270" y="25" class="sans" font-size="12" fill="#8b949e" text-anchor="end">added loss per loan</text>
  </g></g>
</svg>
