  <text x="32" y="44" class="sans" font-size="26" font-weight="700" fill="#e6edf3">Vintage</text>
  <text x="32" y="70" class="sans" font-size="15" fill="#58a6ff">Credit-risk pack on 1.3M Freddie Mac loans, 1999–2026</text>
  <text x="32" y="100" class="sans" font-size="14" fill="#8b949e">WoE scorecard, LGD model and an IFRS 9 / Ind AS 109 expected-loss engine, with a Power BI report.</text>
  <text x="32" y="120" class="sans" font-size="14" fill="#8b949e">Validation rules fixed before fitting. Verdict: ranks risk out of time, not calibrated; 6 of 7 grades fail.</text>
  <g transform="translate(32 136)"><g>
    <rect width="260" height="40" rx="8" fill="#161b22" stroke="#30363d"/><text x="14" y="26" class="mono" font-size="17" font-weight="700" fill="#e6edf3">Gini 0.53</text><text x="246" y="25" class="sans" font-size="12" fill="#8b949e" text-anchor="end">out of time</text>
  </g></g>
  <g transform="translate(308 136)"><g>
    <rect width="260" height="40" rx="8" fill="#161b22" stroke="#30363d"/><text x="14" y="26" class="mono" font-size="17" font-weight="700" fill="#e6edf3">$272.4m</text><text x="246" y="25" class="sans" font-size="12" fill="#8b949e" text-anchor="end">ECL on $80.0bn</text>
