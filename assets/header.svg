<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Terminal: Medhansh Shekhawat, Product Manager moving into Credit Risk Analytics. Projects: Pit Wall, an F1 strategy model whose pre-registered sanity gate failed at 17.6 seconds; LimitIQ, a live credit-line decision system, ROC-AUC 0.781.">
  <defs>
    <style>
      .mono { font-family: 'SFMono-Regular', 'Consolas', 'Liberation Mono', 'Menlo', monospace; font-size: 15px; }
      .prompt { fill: #39d353; }
      .cmd    { fill: #e6edf3; }
      .out    { fill: #8b949e; }
      .hi     { fill: #58a6ff; }
      .warn   { fill: #d29922; }
    </style>

    <!-- Widths are the FINAL values so the card is fully legible even where SMIL
         is not executed (GitHub's image pipeline). Animation only replays it. -->
    <clipPath id="l1"><rect x="24" y="58"  width="300" height="24"><animate attributeName="width" from="0" to="300" dur="0.45s" begin="0.1s" fill="freeze"/></rect></clipPath>
    <clipPath id="l2"><rect x="24" y="92"  width="640" height="24"><animate attributeName="width" from="0" to="640" dur="0.55s" begin="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="l3"><rect x="24" y="140" width="350" height="24"><animate attributeName="width" from="0" to="350" dur="0.45s" begin="1.25s" fill="freeze"/></rect></clipPath>
    <clipPath id="l4"><rect x="24" y="174" width="720" height="24"><animate attributeName="width" from="0" to="720" dur="0.6s"  begin="1.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="l5"><rect x="24" y="208" width="740" height="24"><animate attributeName="width" from="0" to="740" dur="0.65s" begin="2.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="l6"><rect x="24" y="252" width="200" height="24"><animate attributeName="width" from="0" to="200" dur="0.3s"  begin="3.25s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect width="900" height="300" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <rect width="900" height="38" rx="10" fill="#161b22"/>
  <rect y="28" width="900" height="10" fill="#161b22"/>
  <line x1="0" y1="38" x2="900" y2="38" stroke="#30363d" stroke-width="1"/>
  <circle cx="22" cy="19" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="19" r="6" fill="#febc2e"/>
  <circle cx="62" cy="19" r="6" fill="#28c840"/>
  <text x="450" y="24" class="mono out" text-anchor="middle" font-size="13">medhansh — zsh — 90×24</text>

  <text x="24" y="75" class="mono" clip-path="url(#l1)">
    <tspan class="prompt">medhansh@github</tspan><tspan class="out"> ~ $ </tspan><tspan class="cmd">whoami</tspan>
  </text>
  <text x="24" y="109" class="mono out" clip-path="url(#l2)">Medhansh Shekhawat — Product Manager moving into credit risk analytics</text>

  <text x="24" y="157" class="mono" clip-path="url(#l3)">
    <tspan class="prompt">medhansh@github</tspan><tspan class="out"> ~ $ </tspan><tspan class="cmd">cat projects.md</tspan>
  </text>
  <text x="24" y="191" class="mono" clip-path="url(#l4)">
    <tspan class="hi">Pit Wall</tspan><tspan class="out"> · 185 races · the sanity gate I wrote first failed at </tspan><tspan class="warn">17.6 s</tspan>
  </text>
  <text x="24" y="225" class="mono" clip-path="url(#l5)">
    <tspan class="hi">LimitIQ</tspan><tspan class="out"> · live credit-line decisions · ROC-AUC </tspan><tspan class="cmd">0.781</tspan><tspan class="out">, headline cut </tspan><tspan class="warn">85%</tspan>
  </text>

  <text x="24" y="269" class="mono" clip-path="url(#l6)">
    <tspan class="prompt">medhansh@github</tspan><tspan class="out"> ~ $ </tspan>
  </text>
  <rect x="196" y="255" width="9" height="17" fill="#e6edf3">
    <animate attributeName="opacity" values="1;1;0;0;1" dur="1.06s" begin="3.6s" repeatCount="indefinite"/>
  </rect>
</svg>
