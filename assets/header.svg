<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Medhansh Shekhawat. Credit risk and data analytics. I build models, then write down what would prove them wrong before I look.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1426"/><stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" x2="1">
      <stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#39d0c8"/>
    </linearGradient>
    <style>
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .curve { fill: none; stroke-width: 2; stroke-linecap: round; }
      .draw { stroke-dasharray: 900; stroke-dashoffset: 0; animation: draw 2.4s ease-out; }
      .d2 { animation-delay: .3s } .d3 { animation-delay: .6s } .d4 { animation-delay: .9s }
      @keyframes draw { from { stroke-dashoffset: 900 } to { stroke-dashoffset: 0 } }
      .caret { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
    </style>
    <!-- final width is the default so the line reads even without animation -->
    <clipPath id="type"><rect x="40" y="168" width="760" height="30"><animate attributeName="width" from="0" to="760" dur="2.2s" begin="1.2s" fill="freeze"/></rect></clipPath>
  </defs>
  <rect width="900" height="250" rx="12" fill="url(#bg)" stroke="#30363d"/>

  <!-- cumulative default curves by vintage, faint, right side -->
  <g opacity=".5" transform="translate(600 24) scale(.8 .6)">
    <path class="curve draw"    stroke="#1f6feb" d="M0 180 C80 176 160 150 340 40"/>
    <path class="curve draw d2" stroke="#2f81f7" d="M0 180 C90 178 180 160 340 80"/>
    <path class="curve draw d3" stroke="#39d0c8" d="M0 180 C100 179 200 168 340 115"/>
    <path class="curve draw d4" stroke="#3fb950" d="M0 180 C110 180 220 174 340 145"/>
  </g>

  <text x="40" y="78" class="sans" font-size="44" font-weight="700" fill="#e6edf3">Medhansh Shekhawat</text>
  <rect x="40" y="94" width="120" height="4" rx="2" fill="url(#ink)"/>
  <text x="40" y="132" class="sans" font-size="20" fill="#8b949e">Credit risk · Data analytics · Product</text>

  <text x="40" y="190" class="mono" font-size="16" fill="#e6edf3" clip-path="url(#type)"><tspan fill="#39d353">$ </tspan>I build models, then write down what would prove them wrong before I look.</text>
  <rect x="778" y="175" width="9" height="18" fill="#58a6ff" class="caret"/>

  <text x="40" y="226" class="mono" font-size="13" fill="#6e7681">Python · SQL · dbt · scikit-learn · LightGBM · Power BI · FastAPI</text>
</svg>
