<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-label="diffscope. Comments on a dbt pull request with what the change did to the data. 10 million rows per side diffed in 0.541 seconds, 8 of 8 known-answer scenarios, 67 tests.">
  <defs><style>
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .pulse { animation: pulse 1.8s ease-out infinite; transform-origin: 838px 34px }
    @keyframes pulse { from { opacity: .7; transform: scale(1) } to { opacity: 0; transform: scale(2.6) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style></defs>
  <rect width="900" height="190" rx="12" fill="#0d1117" stroke="#30363d"/>
  <rect width="6" height="190" rx="3" fill="#58a6ff"/>
  <circle cx="838" cy="34" r="5" fill="#3fb950" class="pulse"/><circle cx="838" cy="34" r="5" fill="#3fb950"/>
  <text x="852" y="39" class="mono" font-size="12" fill="#3fb950">LIVE</text>
  <text x="32" y="44" class="sans" font-size="26" font-weight="700" fill="#e6edf3">diffscope</text>
  <text x="32" y="70" class="sans" font-size="15" fill="#58a6ff">Shows what a dbt pull request does to the data, as a comment on the PR</text>
  <text x="32" y="100" class="sans" font-size="14" fill="#8b949e">Compares two built versions of a table in DuckDB SQL: rows added, removed and changed, numeric shifts, schema changes.</text>
  <text x="32" y="120" class="sans" font-size="14" fill="#8b949e">Demo: a currency-unit bug turns order 103 from 760 cents into 76,000, and the comment leads with it.</text>
  <g transform="translate(32 136)"><g>
    <rect width="260" height="40" rx="8" fill="#161b22" stroke="#30363d"/><text x="14" y="26" class="mono" font-size="17" font-weight="700" fill="#e6edf3">0.541 s</text><text x="246" y="25" class="sans" font-size="12" fill="#8b949e" text-anchor="end">10M rows per side</text>
  </g></g>
  <g transform="translate(308 136)"><g>
    <rect width="260" height="40" rx="8" fill="#161b22" stroke="#30363d"/><text x="14" y="26" class="mono" font-size="17" font-weight="700" fill="#e6edf3">8/8</text><text x="246" y="25" class="sans" font-size="12" fill="#8b949e" text-anchor="end">known-answer scenarios</text>
  </g></g>
  <g transform="translate(584 136)"><g>
    <rect width="284" height="40" rx="8" fill="#161b22" stroke="#30363d"/><text x="14" y="26" class="mono" font-size="17" font-weight="700" fill="#e6edf3">67</text><text x="270" y="25" class="sans" font-size="12" fill="#8b949e" text-anchor="end">tests</text>
  </g></g>
</svg>
