<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-label="Pit Wall. F1 race-strategy model from 185 races Prices what a place on track is worth at every circuit, then tests its own strategy optimiser. The optimiser failed its pre-registered sanity check. The failure was measured and explained, not tuned away.">
  <defs><style>
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .pulse { animation: pulse 1.8s ease-out infinite; transform-origin: 838px 34px }
    @keyframes pulse { from { opacity: .7; transform: scale(1) } to { opacity: 0; transform: scale(2.6) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style></defs>
  <rect width="900" height="190" rx="12" fill="#0d1117" stroke="#30363d"/>
  <rect width="6" height="190" rx="3" fill="#f85149"/>
  <circle cx="838" cy="34" r="5" fill="#3fb950" class="pulse"/><circle cx="838" cy="34" r="5" fill="#3fb950"/>
  <text x="852" y="39" class="mono" font-size="12" fill="#3fb950">LIVE</text>
  <text x="32" y="44" class="sans" font-size="26" font-weight="700" fill="#e6edf3">Pit Wall</text>
  <text x="32" y="70" class="sans" font-size="15" fill="#f85149">F1 race-strategy model from 185 races</text>
  <text x="32" y="100" class="sans" font-size="14" fill="#8b949e">Prices what a place on track is worth at every circuit, then tests its own strategy optimiser.</text>
  <text x="32" y="120" class="sans" font-size="14" fill="#8b949e">The optimiser failed its pre-registered sanity check. The failure was measured and explained, not tuned away.</text>
  <g transform="translate(32 136)"><g>
    <rect width="260" height="40" rx="8" fill="#161b22" stroke="#30363d"/><text x="14" y="26" class="mono" font-size="17" font-weight="700" fill="#e6edf3">≥ 8.7×</text><text x="246" y="25" class="sans" font-size="12" fill="#8b949e" text-anchor="end">Monaco vs COTA</text>
  </g></g>
  <g transform="translate(308 136)"><g>
    <rect width="260" height="40" rx="8" fill="#161b22" stroke="#30363d"/><text x="14" y="26" class="mono" font-size="17" font-weight="700" fill="#e6edf3">AUC 0.915</text><text x="246" y="25" class="sans" font-size="12" fill="#8b949e" text-anchor="end">overtaking model</text>
  </g></g>
  <g transform="translate(584 136)"><g>
    <rect width="284" height="40" rx="8" fill="#161b22" stroke="#30363d"/><text x="14" y="26" class="mono" font-size="17" font-weight="700" fill="#e6edf3">118</text><text x="270" y="25" class="sans" font-size="12" fill="#8b949e" text-anchor="end">tests in CI</text>
  </g></g>
</svg>
